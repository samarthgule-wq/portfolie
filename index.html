<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer Profile Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="profile-card">
    <!-- Avatar Section with Status Indicator Badge (Bonus) -->
    <div class="avatar-wrapper">
      <img src="e:\Sudha\samarth.jpeg" alt="Samarth Guledgudd Avatar" class="avatar">
      <span class="status-indicator" title="Available for Work"></span>
    </div>

    <!-- Personalized Profile Info -->
    <h2 class="name">Samarth Guledgudd</h2>
    <p class="title">Full Stack Engineer & UI Enthusiast</p>
    <p class="bio">Turning ideas into clean, modern digital experiences.Building scalable web applications and crafting pixel-perfect web experiences with modern frameworks.</p>
    
    <!-- Customized Skill Badges -->
    <div class="skills">
      <span class="badge">HTML</span>
      <span class="badge">Node.js</span>
      <span class="badge">JavaScript</span>
      <span class="badge">Python</span>
      <span class="badge">css</span>
    </div>

    <!-- Action Buttons with Real Profile Links -->
    <div class="actions">
      <a href="https://github.com/samarthgule-wq" target="_blank" class="btn btn-primary">GitHub</a>
      <a href="https://www.linkedin.com/in/samarth-guledgudd-9741a3383?utm_source=share_via&utm_content=profile&utm_medium=member_android" target="_blank" class="btn btn-secondary">LinkedIn</a>
    </div>
  </div>

</body>
</html>
